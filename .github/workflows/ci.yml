name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only; no secrets. The app is signed ad hoc, so no certificates are needed.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - run: scripts/check.sh
      - run: scripts/build.sh
      - run: scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tuglet-mac
          path: release/
          retention-days: 14
